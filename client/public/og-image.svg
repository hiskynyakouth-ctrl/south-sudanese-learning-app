<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0a4d41"/>
      <stop offset="100%" stop-color="#1b3558"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="rgba(255,255,255,0.12)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.04)"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative circles -->
  <circle cx="1100" cy="80"  r="220" fill="rgba(216,134,47,0.15)"/>
  <circle cx="100"  cy="560" r="180" fill="rgba(15,107,91,0.25)"/>
  <circle cx="1050" cy="550" r="120" fill="rgba(255,255,255,0.05)"/>

  <!-- Flag stripe accents (South Sudan flag colors) -->
  <rect x="0" y="0"   width="1200" height="8"  fill="#078930"/>
  <rect x="0" y="8"   width="1200" height="8"  fill="#FCDD09"/>
  <rect x="0" y="16"  width="1200" height="8"  fill="#DA121A"/>
  <rect x="0" y="614" width="1200" height="8"  fill="#078930"/>
  <rect x="0" y="606" width="1200" height="8"  fill="#FCDD09"/>
  <rect x="0" y="598" width="1200" height="8"  fill="#DA121A"/>

  <!-- Card -->
  <rect x="80" y="90" width="1040" height="450" rx="32" fill="url(#card)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>

  <!-- South Sudan Flag emoji area -->
  <circle cx="200" cy="230" r="72" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
  <text x="200" y="250" font-size="72" text-anchor="middle" dominant-baseline="middle">🇸🇸</text>

  <!-- Title -->
  <text x="320" y="195" font-family="'Segoe UI', Arial, sans-serif" font-size="62" font-weight="800" fill="white" letter-spacing="-1">South Sudan</text>
  <text x="320" y="265" font-family="'Segoe UI', Arial, sans-serif" font-size="62" font-weight="800" fill="#FCDD09" letter-spacing="-1">E-Learning</text>

  <!-- Divider -->
  <rect x="320" y="290" width="680" height="3" rx="2" fill="rgba(255,255,255,0.2)"/>

  <!-- Description -->
  <text x="320" y="335" font-family="'Segoe UI', Arial, sans-serif" font-size="28" fill="rgba(255,255,255,0.85)">📚 Senior 1 – 4 · Notes · Quizzes · Past Papers</text>
  <text x="320" y="378" font-family="'Segoe UI', Arial, sans-serif" font-size="28" fill="rgba(255,255,255,0.75)">Official South Sudan Secondary Curriculum</text>

  <!-- Feature pills -->
  <rect x="320" y="410" width="148" height="44" rx="22" fill="rgba(15,107,91,0.7)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <text x="394" y="438" font-family="'Segoe UI', Arial, sans-serif" font-size="20" fill="white" text-anchor="middle">📖 Notes</text>

  <rect x="480" y="410" width="148" height="44" rx="22" fill="rgba(15,107,91,0.7)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <text x="554" y="438" font-family="'Segoe UI', Arial, sans-serif" font-size="20" fill="white" text-anchor="middle">✏️ Quizzes</text>

  <rect x="640" y="410" width="188" height="44" rx="22" fill="rgba(15,107,91,0.7)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <text x="734" y="438" font-family="'Segoe UI', Arial, sans-serif" font-size="20" fill="white" text-anchor="middle">📄 Past Papers</text>

  <rect x="840" y="410" width="188" height="44" rx="22" fill="rgba(216,134,47,0.8)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <text x="934" y="438" font-family="'Segoe UI', Arial, sans-serif" font-size="20" fill="white" text-anchor="middle">🎓 Free Access</text>

  <!-- URL -->
  <text x="600" y="510" font-family="'Segoe UI', Arial, sans-serif" font-size="22" fill="rgba(255,255,255,0.5)" text-anchor="middle">south-sudanese-learning-app-two.vercel.app</text>
</svg>
