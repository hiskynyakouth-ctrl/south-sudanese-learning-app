services:
  - type: web
    name: ss-elearning-api
    env: node
    region: oregon
    plan: free
    rootDir: server
    branch: main
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        value: ss_elearning_jwt_secret_2024
      - key: GMAIL_USER
        value: thiyangkoang77@gmail.com
      - key: GMAIL_APP_PASSWORD
        sync: false
      # ── PostgreSQL — set this in Render Dashboard → Environment ──
      # Create a free PostgreSQL database on Render, then copy the
      # Internal Database URL here as DATABASE_URL
      - key: DATABASE_URL
        sync: false
      - key: CLIENT_URL
        value: https://south-sudanese-learning-app-two.vercel.app

databases:
  - name: ss-elearning-db
    plan: free
    region: oregon
